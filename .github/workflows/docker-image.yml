name: Build Docker Image

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  # write: the Windows package is attached to the rolling release of its channel (windows-latest / windows-nightly).
  contents: write
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # GHCR is always used (via GITHUB_TOKEN). Docker Hub is used in parallel only when the
          # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are configured - otherwise the build still
          # succeeds and publishes to GHCR only.
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "DOCKERHUB_ENABLED=true" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME,,}/matmon" >> "$GITHUB_ENV"
          else
            echo "DOCKERHUB_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Compute version and image tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          build_date="$(date -u +%Y%m%d-%H%M)"
          run="${{ github.run_number }}"
          branch="${GITHUB_REF_NAME}"

          # main = release channel, dev = nightly channel, everything else = local.
          if [ "$branch" = "main" ]; then
            version="${base}.${run}-${build_date}"
            extra_tag="latest"
          elif [ "$branch" = "dev" ]; then
            version="nightly-${run}-${build_date}"
            extra_tag="nightly"
          else
            version="local-${build_date}"
            extra_tag=""
          fi

          # Publish the same tags to every configured registry (GHCR + optionally Docker Hub).
          images="${IMAGE_NAME}"
          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            images="${images} ${DOCKERHUB_IMAGE}"
          fi

          tags=""
          for img in $images; do
            tags="${tags}${img}:${version}"$'\n'
            if [ -n "$extra_tag" ]; then
              tags="${tags}${img}:${extra_tag}"$'\n'
            fi
          done
          tags="$(printf '%s' "$tags" | sed '/^$/d')"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version} for branch ${branch}"
          echo "Publishing tags:"
          echo "${tags}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Matmon.Host/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            MATMON_VERSION=${{ steps.version.outputs.version }}
          # Signs the agent packages (and makes the agents refuse unsigned updates) when the secret is set;
          # empty = unsigned packages, exactly as before. See AgentPackageSignature.
          secrets: |
            agent_signing_key=${{ secrets.MATMON_AGENT_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Windows instance: the same build as a win-x64 package + manifest (the Dockerfile's windows-feed stage, which
      # reuses the cached build and agent stages), for the Windows service's self-update (WindowsUpdateFeed).
      - name: Build the Windows package
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Matmon.Host/Dockerfile
          target: windows-feed
          push: false
          outputs: type=local,dest=windows-feed
          build-args: |
            MATMON_VERSION=${{ steps.version.outputs.version }}
          secrets: |
            agent_signing_key=${{ secrets.MATMON_AGENT_SIGNING_KEY }}
          cache-from: type=gha

      # One rolling release per channel; each build replaces its two files. The package goes up BEFORE the manifest, so
      # an instance never reads a manifest whose package is not there yet.
      - name: Publish the Windows package
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag="windows-latest"; title="Matmon for Windows (release channel)"; prerelease=""
          else
            tag="windows-nightly"; title="Matmon for Windows (nightly channel)"; prerelease="--prerelease"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$title" --target "$GITHUB_SHA" $prerelease \
              --notes "The Windows package of the newest ${tag#windows-} build. Unpack it and run 'Matmon.Host.exe install-service' in an elevated prompt; the service then updates itself from here (System > Updates)."
          fi
          gh release upload "$tag" windows-feed/matmon-windows-x64.zip --clobber
          gh release upload "$tag" windows-feed/matmon-windows-x64.json --clobber
          echo "Published $(jq -r .version windows-feed/matmon-windows-x64.json) to $tag"
