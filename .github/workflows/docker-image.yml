name: Build Docker Image

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute version and image tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          build_date="$(date -u +%Y%m%d-%H%M)"
          run="${{ github.run_number }}"
          branch="${GITHUB_REF_NAME}"

          # main = release channel, dev = nightly channel, everything else = local.
          if [ "$branch" = "main" ]; then
            version="${base}.${run}-${build_date}"
            extra_tag="latest"
          elif [ "$branch" = "dev" ]; then
            version="nightly-${run}-${build_date}"
            extra_tag="nightly"
          else
            version="local-${build_date}"
            extra_tag=""
          fi

          tags="${IMAGE_NAME}:${version}"
          if [ -n "$extra_tag" ]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${extra_tag}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version} for branch ${branch}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Matmon.Host/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            MATMON_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
