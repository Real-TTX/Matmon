# Development / multi-node stack: primary + a sample secondary probe, built from source with the
# workspace bind-mounted to ./data so you can inspect it. For a normal single-node install use the
# plain docker-compose.yml instead.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#     primary → http://localhost:8099   sample probe → http://localhost:8100
#
# The optional "assistant" profile starts a second, pristine primary (its own ./data-assistant) for
# exercising the first-run setup wizard end to end:
#   docker compose -f docker-compose.dev.yml --profile assistant up -d --build assistant  → :8101

services:
  primary:
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    extra_hosts:
      - "pc-terminal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      Matmon__Mode: Primary
      Matmon__HeartbeatIntervalSeconds: 30
      Matmon__WorkspacePath: data/workspace.json
      # No Matmon__Auth__* → first launch shows the setup wizard (create the admin account).
      # Set Matmon__Auth__Username/Password to pre-provision an admin headlessly and skip setup.
      Matmon__ProvisionLocalDockerProbe: true
      Matmon__AutoCreateProbeSystemSensors: true
      Matmon__CreateStarterMap: true
      # Auto-provision a "UniFi Cloud" sensor when a key is supplied (via .env, gitignored).
      Matmon__UnifiCloudApiKey: ${UNIFI_CLOUD_API_KEY:-}
      # Allow-list for the "Local Program" sensor (semicolon-separated files/dirs). Empty = none.
      Matmon__AllowedProgramPaths: ${MATMON_ALLOWED_PROGRAM_PATHS:-}
      # Matmon.Cloud control-plane link (heartbeat + public status). Real values via .env (gitignored).
      Matmon__CloudUrl: ${MATMON_CLOUD_URL:-}
      Matmon__CloudInstanceId: ${MATMON_CLOUD_INSTANCE_ID:-}
      Matmon__CloudInstanceToken: ${MATMON_CLOUD_INSTANCE_TOKEN:-}
    ports:
      - "8099:8099"
    volumes:
      - ./data:/app/data

  probe-01:
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    environment:
      Matmon__Mode: Secondary
      Matmon__ProbeId: probe-01
      Matmon__ProbeName: Remote Probe 01
      Matmon__ProbeToken: probe-01-token
      Matmon__PrimaryUrl: http://primary:8099
      Matmon__HeartbeatIntervalSeconds: 30
    ports:
      - "8100:8099"
    depends_on:
      - primary

  # A fresh SECOND primary for exercising the first-run setup ASSISTANT end-to-end (empty workspace →
  # /setup: create the admin account → 2FA → connect to Matmon.Cloud → license). Its own data volume keeps
  # it pristine and separate from the main `primary`. No Matmon__Auth__* + no seeding flags = a clean wizard.
  # Reset it to run the wizard again: `docker compose rm -sf assistant` then delete ./data-assistant.
  assistant:
    profiles: ["assistant"]
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      Matmon__Mode: Primary
      Matmon__HeartbeatIntervalSeconds: 30
      Matmon__WorkspacePath: data/workspace.json
      # Pre-fill the cloud URL for the wizard's connect step (optional; via .env, gitignored).
      Matmon__CloudUrl: ${MATMON_CLOUD_URL:-}
    ports:
      - "8101:8099"
    volumes:
      - ./data-assistant:/app/data
