# Optional local build override for development.
# The normal docker-compose.master.yml pulls the image from GitHub Container Registry.
#
# Build from the current checkout instead:
#   docker compose --env-file .env.master -f docker-compose.master.yml -f docker-compose.master.build.yml up -d --build

services:
  matmon-master:
    image: ${MATMON_IMAGE:-matmon-master:local}
    pull_policy: build
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
