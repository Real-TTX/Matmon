<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-label="Matmon">
  <title>Matmon</title>
  <!-- Shared favicon: the Matmon M silhouette in the brand gradient. Square viewBox because this file is
       ALSO used in the instance's 1.35rem square mobile-header slot, where a wide asset would distort.
       Flat silhouette on purpose - the shaded mark's fold shadows turn to mud at 16px. The gradient stays
       mid-tone end to end so the glyph reads on a light AND a dark tab bar.
       Same file in Matmon + Matmon.Cloud + Matmon.Web - change it in all three. -->
  <defs>
    <linearGradient id="mmFav" x1="0" y1="0" x2="1" y2=".45">
      <stop offset="0" stop-color="#1A6FD0"/><stop offset=".55" stop-color="#12A8DC"/><stop offset="1" stop-color="#17C2BC"/>
    </linearGradient>
  </defs>
  <path transform="translate(8 54)" fill="url(#mmFav)" d="M74.6 2Q78 0 82 0L90 0Q93.7 0 96.8 2.5L224.6 107.3Q228.5 110.5 232.4 107.4L366.3 2.5Q369.4 0 372.8 2.1L440.6 44.4Q444 46.5 444 51.5L444 290.7Q444 295.7 440.5 298.2L350 352Q328 352 328 322L328 160L229.4 247.3Q226.4 250 222.4 250L215.1 250Q211.1 250 208.2 247.2L116 158.3L116 322Q116 352 94 352L4.3 294.9Q0 292.2 0 287.2L0 51.4Q0 46.4 4 43.9Z"/>
</svg>
