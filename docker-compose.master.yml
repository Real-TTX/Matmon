# Portable Matmon primary deployment.
# Use this on any Docker host that should run the central Matmon UI/API.
#
# Start:
#   cp .env.master.example .env.master
#   docker compose --env-file .env.master -f docker-compose.master.yml pull
#   docker compose --env-file .env.master -f docker-compose.master.yml up -d
#
# Open:
#   http://<docker-host-ip>:8099

services:
  matmon-primary:
    image: ${MATMON_IMAGE:-ghcr.io/real-ttx/matmon:latest}
    pull_policy: ${MATMON_PULL_POLICY:-always}
    container_name: ${MATMON_CONTAINER_NAME:-matmon-primary}
    restart: unless-stopped
    labels:
      # Opt this container in to automatic image updates by Watchtower (below).
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      ASPNETCORE_URLS: http://+:8099
      Matmon__Mode: Primary
      Matmon__HeartbeatIntervalSeconds: ${MATMON_HEARTBEAT_SECONDS:-30}
      Matmon__WorkspacePath: /app/data/workspace.json
      Matmon__BackupPath: /app/backups
      Matmon__DataProtectionPath: /app/keys
      Matmon__Auth__Username: ${MATMON_ADMIN_USER:-admin}
      Matmon__Auth__Password: ${MATMON_ADMIN_PASSWORD:-admin}
      Matmon__SeedSampleData: ${MATMON_SEED_SAMPLE_DATA:-false}
      Matmon__ProvisionLocalDockerProbe: ${MATMON_PROVISION_LOCAL_DOCKER_PROBE:-false}
      Matmon__ProvisionDemoSensors: ${MATMON_PROVISION_DEMO_SENSORS:-false}
      Matmon__AutoCreateProbeSystemSensors: ${MATMON_AUTO_CREATE_PROBE_SYSTEM_SENSORS:-false}
      Matmon__CreateStarterMap: ${MATMON_CREATE_STARTER_MAP:-false}
    ports:
      - "${MATMON_HTTP_BIND:-0.0.0.0}:${MATMON_HTTP_PORT:-8099}:8099"
    volumes:
      - matmon-data:/app/data
      - matmon-backups:/app/backups
      - matmon-keys:/app/keys
    extra_hosts:
      # Lets sensors reach services on the Docker host through host.docker.internal.
      # Works on Docker Desktop and modern Linux Docker engines.
      - "host.docker.internal:host-gateway"
    networks:
      - matmon

  # Keeps the Matmon container on the latest published image automatically:
  # polls GHCR on an interval and recreates the container when :latest changes.
  # Scoped via --label-enable so it only touches the labelled Matmon container.
  watchtower:
    image: containrrr/watchtower
    container_name: ${MATMON_WATCHTOWER_NAME:-matmon-watchtower}
    restart: unless-stopped
    command: --cleanup --label-enable --interval ${MATMON_UPDATE_INTERVAL_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - matmon

networks:
  matmon:
    name: ${MATMON_NETWORK_NAME:-matmon}

volumes:
  matmon-data:
    name: ${MATMON_DATA_VOLUME:-matmon-data}
  matmon-backups:
    name: ${MATMON_BACKUP_VOLUME:-matmon-backups}
  matmon-keys:
    name: ${MATMON_KEYS_VOLUME:-matmon-keys}
