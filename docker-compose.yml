name: matmon

services:
  matmon:
    image: ${MATMON_IMAGE:-ghcr.io/real-ttx/matmon:latest}
    container_name: matmon
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      TZ: Europe/Berlin
    volumes:
      # Everything Matmon keeps - workspace.json, telemetry.db, the DataProtection keys and the
      # config backups - lives under /app/data. One volume is all you need to back up or move.
      - matmon-data:/app/data
    extra_hosts:
      # Lets sensors reach services on the Docker host through host.docker.internal.
      - "host.docker.internal:host-gateway"

  # Optional remote probe (secondary). It connects OUTBOUND to the primary, so it runs behind
  # NAT/firewalls without an inbound port. Copy this block per site, give each a unique ProbeId +
  # ProbeToken, and point PrimaryUrl at this primary. Uncomment to enable.
  # probe:
  #   image: ${MATMON_IMAGE:-ghcr.io/real-ttx/matmon:latest}
  #   container_name: matmon-probe
  #   restart: unless-stopped
  #   environment:
  #     Matmon__Mode: Secondary
  #     Matmon__ProbeId: probe-01
  #     Matmon__ProbeName: Remote Probe 01
  #     Matmon__ProbeToken: change-me-to-a-secret
  #     Matmon__PrimaryUrl: http://your-primary-host:8099

volumes:
  matmon-data:
