services:
  primary:
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    extra_hosts:
      - "pc-terminal:host-gateway"
    environment:
      Matmon__Mode: Primary
      Matmon__HeartbeatIntervalSeconds: 30
      Matmon__WorkspacePath: data/workspace.json
      Matmon__Auth__Username: admin
      Matmon__Auth__Password: admin
      Matmon__ProvisionLocalDockerProbe: true
      Matmon__AutoCreateProbeSystemSensors: true
      Matmon__CreateStarterMap: true
      # Auto-provision a "UniFi Cloud" sensor when a key is supplied (via .env, gitignored).
      Matmon__UnifiCloudApiKey: ${UNIFI_CLOUD_API_KEY:-}
    ports:
      - "8099:8099"
    volumes:
      - ./data:/app/data

  probe-01:
    build:
      context: .
      dockerfile: src/Matmon.Host/Dockerfile
    environment:
      Matmon__Mode: Secondary
      Matmon__ProbeId: probe-01
      Matmon__ProbeName: Remote Probe 01
      Matmon__ProbeToken: probe-01-token
      Matmon__PrimaryUrl: http://primary:8099
      Matmon__HeartbeatIntervalSeconds: 30
    ports:
      - "8100:8099"
    depends_on:
      - primary
